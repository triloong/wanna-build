---
priority:
    keys:
        distribution:
            trixie-security: 400
            bookworm-security: 400
            bullseye-security: 300
            bullseye: 200
            bookworm: 200
            trixie: 100
            trixie-proposed-updates: 100
            sid: 0
            experimental: -100
            trixie-backports: -200
            trixie-backports-sloppy: -200
            bookworm-backports: -200
            bookworm-backports-sloppy: -200
            bullseye-backports: -200
            bullseye-backports-sloppy: -200
        component:
            contrib: -10
            non-free: -20
        notes:
            uncompiled: 20
            out-of-date: 40
            partial: 40
    waitingdays:
        min: 0
        max: 6
        scale: 2
    buildhours:
        default: 2
        min: 0
        max: 15
list-order:
    default: PScpsn
    failed: Pcpsn
    needs-build: CWTn
    building: bn
restrict:
    component: main contrib non-free non-free-firmware
